name: gitactions-demo-test
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: demo message
        run: echo "hi github actions"
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
        - name: checkout code
          uses: actions/checkout@v4

        - name: install python
          uses: actions/setup-python@v5
          with:
            python-version: "3.12"

        - name: install pytest
          run: pip install pytest

        - name: run test
          run: pytest
      # - name: secret demo
      #   run: echo ${{secrets.DB_PASSWORD}}
        
